server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Aplicación de una sola página: cualquier ruta que no exista como fichero
    # debe servir index.html para que react-router la resuelva en el cliente.
    # Sin esto, recargar en /perfil daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
