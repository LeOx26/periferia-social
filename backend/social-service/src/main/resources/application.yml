server:
  port: 8082

spring:
  application:
    name: social-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/socialdb}
    username: ${DB_USER:periferia}
    password: ${DB_PASSWORD:periferia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    # Sin `expiration-minutes`: este servicio verifica tokens, nunca los emite.
    # Que la configuración lo refleje es parte de la decisión de no acoplar servicios.
    secret: ${JWT_SECRET:desarrollo-secreto-local-de-al-menos-32-bytes!}

feed:
  max-page-size: 50

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Sin esto Micrometer solo publica count/sum/max, no los buckets del
      # histograma, y `histogram_quantile` en Prometheus no devuelve nada.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 250ms, 500ms, 1s
