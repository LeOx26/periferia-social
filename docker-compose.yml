services:
  postgres:
    image: postgres:16-alpine
    container_name: periferia-postgres
    environment:
      POSTGRES_USER: periferia
      POSTGRES_PASSWORD: periferia
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U periferia"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    container_name: periferia-auth
    depends_on:
      postgres:
        # Espera a que Postgres acepte conexiones de verdad, no un sleep arbitrario.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      DB_USER: periferia
      DB_PASSWORD: periferia
      JWT_SECRET: ${JWT_SECRET:-desarrollo-secreto-local-de-al-menos-32-bytes!}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  social-service:
    build: ./backend/social-service
    container_name: periferia-social
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/socialdb
      DB_USER: periferia
      DB_PASSWORD: periferia
      # Exactamente el mismo valor que en auth-service: es lo ÚNICO que ambos
      # servicios comparten, y es el precio de que social no llame a auth.
      JWT_SECRET: ${JWT_SECRET:-desarrollo-secreto-local-de-al-menos-32-bytes!}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    container_name: periferia-prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - social-service

  grafana:
    image: grafana/grafana:latest
    container_name: periferia-grafana
    environment:
      # Acceso anónimo con rol de administrador: es un entorno de demostración y
      # no tiene sentido pedirle credenciales al evaluador. En producción, jamás.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
