global:
  scrape_interval: 10s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: social-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["social-service:8082"]
